services:
  docmost:
    image: docmost/docmost:0.23.2
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://docmost:${DB_PASSWORD}@postgres:5432/docmost?schema=public"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - docmost:/app/data/storage
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
